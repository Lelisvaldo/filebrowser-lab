<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#170a38">
<title>Filebrowser Lab</title>
<style>
@font-face{font-family:"Open Sans";font-weight:300 800;font-display:swap;src:url(fonts/open-sans-latin-wght-normal.woff2) format("woff2")}
/* Cores e fontes do site (frontend-lab/src/css/base.css) */
:root{--bg:#e6e9ed;--pagebg:#e6e9ed;--side:#dbdfe4;--card:#f1f3f5;--txt:#1b1f26;--sub:#586070;--line:#c9ced6;--acc:#0b62b8;--warn:#b84f0b;--warnbg:#f5ddca;--okbg:#d3eadc;--ok:#0d7a40;--dkin:#d3d9e2;--gA:linear-gradient(90deg,#0bc7d3,#7a76d4,#f31ed2);--on:#fff;--font:"Open Sans","Segoe UI",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#170a38;--pagebg:linear-gradient(135deg,#1f0c4c 0%,#170a38 50%,#0f0623 100%);--side:#120a33;--card:#1c0d46;--txt:#f6f3ff;--sub:#a99bd8;--line:#2f1a67;--acc:#01ced3;--warn:#ff9630;--warnbg:#3e2243;--okbg:#0f3a5c;--ok:#00c6cf;--dkin:#241258;--on:#120a33;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--pagebg);background-color:var(--bg);color:var(--txt);font:16px/1.5 var(--font);padding:24px}
main{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.brand svg{width:46px;height:46px;flex:none}
h1{margin:0;font-size:1.35rem;line-height:1.1}h1 b{color:var(--acc)}
.tag{font-size:.75rem;color:var(--sub)}
p{margin:8px 0;color:var(--sub)}
label{display:block;margin:16px 0 6px;font-weight:600}
input{width:100%;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--dkin);color:var(--txt);padding:0 14px;font:inherit}
input:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
button{width:100%;height:48px;margin-top:14px;border:0;border-radius:10px;font:inherit;font-weight:700;color:var(--on);background:var(--gA);cursor:pointer}
button.sec{background:transparent;color:var(--txt);border:1px solid var(--line)}
.msg{margin-top:14px;padding:12px;border-radius:10px;background:var(--warnbg);color:var(--warn);display:none}
.msg.on{display:block}.msg.wait{background:var(--okbg);color:var(--ok)}
small{color:var(--sub)}code{background:var(--dkin);padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<main>
  <div class="brand"><svg viewBox="0 0 38 38" aria-hidden="true"><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9630"/><stop offset="1" stop-color="#ff1bca"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01ced3"/><stop offset="1" stop-color="#065e9e"/></linearGradient></defs><rect x="3" y="4" width="32" height="30" rx="8" fill="#1c0d46" stroke="#3a2480"/><path d="M9 13a2.5 2.5 0 0 1 2.5-2.5h4l2.2 2.2H26.5A2.5 2.5 0 0 1 29 15.2V22a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 9 22z" fill="url(#a)"/><circle cx="10.1" cy="27.6" r="1.1" fill="#ff9630"/><circle cx="13" cy="27.6" r="1.1" fill="#ff15d2"/><circle cx="15.9" cy="27.6" r="1.1" fill="#7a76d4"/><circle cx="18.8" cy="27.6" r="1.1" fill="#01ced3"/><rect x="20.9" y="26.5" width="8.1" height="2.2" rx="1.1" fill="url(#b)"/></svg><div><h1>file<b>browser</b> lab</h1><div class="tag">seu servidor de arquivos</div></div></div>
  <p id="sub">Conecte ao seu servidor.</p>
  <form id="f" autocomplete="off">
    <label for="u">Endereço do servidor</label>
    <input id="u" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://filebrowser.lab">
    <button type="submit">Conectar</button>
  </form>
  <div id="m" class="msg" role="status"></div>
  <button id="retry" class="sec" type="button" hidden>Tentar de novo</button>
  <p><small>Para endereços <code>.lab</code>, instale antes o certificado da casa neste aparelho (<code>http://certificado.lab</code>).</small></p>
</main>
<script>
(function () {
  var KEY = "labServer", u = document.getElementById("u"), m = document.getElementById("m"), retry = document.getElementById("retry"), sub = document.getElementById("sub");
  var get = function () { try { return localStorage.getItem(KEY) || ""; } catch (e) { return ""; } };
  var norm = function (v) { v = (v || "").trim().replace(/\/+$/, ""); if (v && !/^https?:\/\//i.test(v)) v = "https://" + v; return v; };
  var say = function (t, wait) { m.textContent = t; m.className = "msg on" + (wait ? " wait" : ""); };
  var withTimeout = function (ms) { var c = new AbortController(); setTimeout(function () { c.abort(); }, ms); return c.signal; };
  // confere no app (nativo) se o endereço é um filebrowser-lab; fora do app (ou sem a ponte) segue como antes
  function check(url, cb) {
    if (!window.LabNative || !window.LabNative.probe) { cb({ ok: true, legacy: true }); return; }
    var done = false;
    var t = setTimeout(function () { if (!done) { done = true; cb({ ok: false, code: 0 }); } }, 10000);
    window.__labProbe = function (r) { if (!done) { done = true; clearTimeout(t); cb(r); } };
    window.LabNative.probe(url);
  }
  function go(url) {
    say("Conectando a " + url + "…", true); retry.hidden = true;
    check(url, function (r) {
      if (r.ok) {
        try { localStorage.setItem(KEY, url); } catch (e) {}
        location.replace(url + "/");
      } else if (r.code > 0) {
        say("Esse endereço respondeu, mas não é um servidor filebrowser-lab (código " + r.code + "). Confira o endereço, por exemplo https://filebrowser.lab.");
        retry.hidden = false;
      } else {
        say("Não consegui falar com " + url + ". Confira o Wi-Fi da casa e se o certificado da casa está instalado neste aparelho.");
        retry.hidden = false;
      }
    });
  }
  document.getElementById("f").addEventListener("submit", function (e) { e.preventDefault(); var v = norm(u.value); if (!v) { say("Digite o endereço do servidor."); return; } go(v); });
  retry.addEventListener("click", function () { var v = norm(u.value) || get(); if (v) go(v); });
  var saved = get(), change = /[?&]trocar=1/.test(location.search);
  u.value = saved || "https://filebrowser.lab"; // endereço já preenchido nesta fase de testes; o usuário pode apagar e digitar outro
  if (saved && !change) { sub.textContent = "Abrindo o servidor…"; go(saved); }
})();
</script>
</body>
</html>
